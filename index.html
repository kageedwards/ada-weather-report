<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Weather Report</title>
<link rel="stylesheet" href="styles/index.css">
<script defer src="https://unpkg.com/axios/dist/axios.min.js"></script>
<script defer src="src/index.js"></script>
</head>

<body>

<header>
	<h1>Weather Report</h1>
	<p>What's the weather like today?</p>
</header>

<main>
	<section id="city-section">
		<h2 id="city-name">Seattle</h2>
	</section>
	
	<section id="weather-container">
		<div id="temperature-container">
			<h2>
				<button id="decrease-temperature">&ndash;</button><span id="temperature">°F</span><button id="increase-temperature">+</button>
			</h2>
		</div>
	</section>

	<section>
		<div id="sky"></div>
		<div id="landscape"></div>
	</section>
	
	<section id="rename-section">
		<h3>Select City</h3>
		<input
			type="text"
			id="city-input"
			placeholder="Enter city name">
		<button id="select-button">Select</button>
		<p id="error-message"></p>
	</section>

	<section id="current-weather-section">
		<button id="get-weather-button">Get Current Weather</button>
	</section>

	<section id="sky-section">
		<h3>Choose Sky Type</h3>
		<select id="sky-select">
			<option value="sunny">Sunny</option>
			<option value="cloudy">Cloudy</option>
			<option value="rainy">Rainy</option>
			<option value="snowy">Snowy</option>
		</select>
	</section>
	
	<section id="reset-section">
		<button id="reset-city-button">Reset</button>
	</section>

</main>
<footer>
	<p>Weather Report App</p>
</footer>
</body>
</html>
